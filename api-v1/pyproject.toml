[project]
name = "strategicplan-api"
version = "0.1.0"
description = "Open-source REST API for StrategicPlan reporting"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.138.2",
  "uvicorn[standard]==0.37.0",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.11.0"
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

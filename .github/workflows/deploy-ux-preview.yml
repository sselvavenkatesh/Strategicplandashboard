name: Deploy UX Preview to GitHub Pages
on:
  push:
    branches:
      - v2.1
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2.1
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload UX preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ux-preview
      - name: Deploy UX preview
        id: deployment
        uses: actions/deploy-pages@v4

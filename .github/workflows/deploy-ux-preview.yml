name: Deploy UX Preview to GitHub Pages
on:
  push:
    branches: [v2.1]
    paths:
      - 'ux-preview/**'
      - '.github/workflows/deploy-ux-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./ux-preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
